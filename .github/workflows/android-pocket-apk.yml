name: ClipOps Pocket Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-pocket-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-pocket-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Android source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android SDK and install API 35
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test clip boundaries and build standalone debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Check private offline app manifest and archive integrity
        run: |
          set -euo pipefail
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload APK for direct Android installation
        uses: actions/upload-artifact@v4
        with:
          name: ClipOps-Pocket-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
