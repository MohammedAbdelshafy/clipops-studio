name: ClipOps offline release gate

on:
  pull_request:
    # Include the existing stacked PR base so the gate can run before merging.
    branches: [main, feat/clipops-video-mvp-20261112]
    paths:
      - 'clipops.py'
      - 'batch_images.py'
      - 'test_clipops.py'
      - 'test_batch_images.py'
      - '.github/workflows/clipops-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate FFmpeg availability
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
      - name: Run image-batch and video MVP regressions
        env:
          CLIPOPS_ALLOW_PUBLISH: '0'
          POSTIZ_API_KEY: ''
          GEMINI_API_KEY: ''
        run: |
          python -m unittest -v test_batch_images.py test_clipops.py
      - name: Confirm no publishing side effect
        run: |
          echo 'Tests run with CLIPOPS_ALLOW_PUBLISH=0; no live dispatch was invoked.'
