name: ClipOps offline release gate

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'studio/**'
      - 'tools/**'
      - 'requirements*.txt'
      - '.github/workflows/clipops-release-gate.yml'
  pull_request:
    # Include the existing stacked PR base so the gate can run before merging.
    branches: [main, feat/clipops-video-mvp-20261112, review/clipops-release-ci-2026-11-14, review/clipops-pilot-hardening-20261120, review/clipops-cinematic-video-ui-20261120]
    paths:
      - '*.py'
      - 'studio/**'
      - 'tools/**'
      - 'requirements-pilot.txt'
      - '.github/workflows/clipops-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install FFmpeg and local fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-liberation
      - name: Validate FFmpeg availability
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
      - name: Install local caption layout dependency
        run: python -m pip install -r requirements-pilot.txt
      - name: Check browser application syntax
        run: node --check studio/app.js
      - name: Run image-batch, video, export and review regressions
        env:
          CLIPOPS_ALLOW_PUBLISH: '0'
          POSTIZ_API_KEY: ''
          GEMINI_API_KEY: ''
        run: |
          python -m unittest discover -v
          python -m unittest discover -s tools/transcript_brief -p 'test_*.py' -v

  browser-smoke:
    # Playwright 1.57 does not yet support the ubuntu-26.04 hosted image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core fonts-liberation
      - name: Install local editor and browser requirements
        run: |
          python -m pip install -r requirements-pilot.txt
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Generate original synthetic source
        run: |
          mkdir -p /tmp/clipops-fixtures
          python tools/make_fixtures.py /tmp/clipops-fixtures --only studio --espeak ''
      - name: Exercise desktop/mobile editor and delivery gates
        env:
          CLIPOPS_ALLOW_PUBLISH: '0'
          POSTIZ_API_KEY: ''
          GEMINI_API_KEY: ''
        run: |
          test -x "$(command -v google-chrome)"
          python tools/test_studio_browser.py --chromium "$(command -v google-chrome)" --fixtures /tmp/clipops-fixtures --screenshots /tmp/clipops-browser-evidence

      - name: Keep synthetic browser screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipOps-synthetic-browser-QA
          path: /tmp/clipops-browser-evidence/*.png
          retention-days: 7
          if-no-files-found: ignore

  package-test-build:
    needs: [offline-test, browser-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - name: Checkout exact tested integration source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create a checksum-manifested offline test ZIP
        run: |
          python3 tools/package_test_build.py "$RUNNER_TEMP/ClipOps-Studio-TEST.zip"
          unzip -t "$RUNNER_TEMP/ClipOps-Studio-TEST.zip"
      - name: Upload reviewed local test app
        uses: actions/upload-artifact@v4
        with:
          name: ClipOps-Studio-TEST
          path: ${{ runner.temp }}/ClipOps-Studio-TEST.zip
          retention-days: 14
          if-no-files-found: error
